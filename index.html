<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جدول المذاكرة</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fdf6ee;
        --card: #fff;
        --arabic: #c0392b;
        --english: #2980b9;
        --science: #27ae60;
        --social: #8e44ad;
        --algebra: #e67e22;
        --geometry: #16a085;
        --review-bg: #fff8f0;
        --study-bg: #f0f8ff;
        --done-color: #2ecc71;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Cairo", "Tajawal", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        padding: 30px 20px 60px;
        background-image:
          radial-gradient(circle at 20% 20%, #fce8d8 0%, transparent 40%),
          radial-gradient(circle at 80% 80%, #dff0ea 0%, transparent 40%);
      }

      header {
        text-align: center;
        margin-bottom: 40px;
      }

      header h1 {
        font-size: 2.8rem;
        font-weight: 900;
        color: #1a1a2e;
        line-height: 1.2;
      }

      header h1 span {
        color: var(--arabic);
      }

      header p {
        color: #777;
        font-size: 1rem;
        margin-top: 8px;
      }

      /* Progress bar */
      .progress-section {
        max-width: 700px;
        margin: 0 auto 40px;
        background: white;
        border-radius: var(--radius);
        padding: 20px 28px;
        box-shadow: var(--shadow);
      }

      .progress-section h3 {
        font-size: 1rem;
        color: #555;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .progress-bar-outer {
        height: 18px;
        background: #eee;
        border-radius: 99px;
        overflow: hidden;
      }

      .progress-bar-inner {
        height: 100%;
        background: linear-gradient(90deg, #27ae60, #2ecc71);
        border-radius: 99px;
        transition: width 0.5s ease;
        width: 0%;
      }

      .progress-label {
        margin-top: 8px;
        font-size: 0.9rem;
        color: #888;
        text-align: left;
        direction: ltr;
      }

      /* Tabs for weeks */
      .weeks-nav {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .week-btn {
        padding: 10px 22px;
        border-radius: 99px;
        border: 2px solid #ddd;
        background: white;
        cursor: pointer;
        font-family: "Cairo", sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        color: #888;
        transition: all 0.2s;
      }

      .week-btn:hover {
        border-color: var(--arabic);
        color: var(--arabic);
      }

      .week-btn.active {
        background: #1a1a2e;
        border-color: #1a1a2e;
        color: white;
      }

      /* Week grid */
      .week-grid {
        display: none;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        max-width: 1100px;
        margin: 0 auto;
      }

      .week-grid.visible {
        display: grid;
      }

      /* Day card */
      .day-card {
        background: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        transition: transform 0.2s;
      }

      .day-card:hover {
        transform: translateY(-3px);
      }

      .day-header {
        padding: 14px 18px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .day-header .day-name {
        font-size: 1.15rem;
        font-weight: 900;
        color: white;
        flex: 1;
      }

      .day-header .day-date {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.8);
        font-weight: 500;
      }

      /* Subject colors for header */
      .subject-arabic .day-header {
        background: linear-gradient(135deg, #c0392b, #e74c3c);
      }
      .subject-english .day-header {
        background: linear-gradient(135deg, #2980b9, #3498db);
      }
      .subject-science .day-header {
        background: linear-gradient(135deg, #27ae60, #2ecc71);
      }
      .subject-social .day-header {
        background: linear-gradient(135deg, #8e44ad, #9b59b6);
      }
      .subject-algebra .day-header {
        background: linear-gradient(135deg, #e67e22, #f39c12);
      }
      .subject-geometry .day-header {
        background: linear-gradient(135deg, #16a085, #1abc9c);
      }

      .subject-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 99px;
        padding: 3px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        color: white;
      }

      /* Session block */
      .sessions {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .session {
        border-radius: 12px;
        padding: 12px 14px;
        position: relative;
        transition: all 0.3s;
      }

      .session.review-session {
        background: var(--review-bg);
        border: 1.5px solid #fde8cc;
      }

      .session.study-session {
        background: var(--study-bg);
        border: 1.5px solid #cce5ff;
      }

      .session-type-label {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 5px;
        text-transform: uppercase;
        opacity: 0.6;
      }

      .review-session .session-type-label {
        color: #c0392b;
      }
      .study-session .session-type-label {
        color: #2980b9;
      }

      .session-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: #1a1a2e;
        line-height: 1.4;
        padding-left: 36px;
      }

      .check-btn {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid #ccc;
        background: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        transition: all 0.25s;
        flex-shrink: 0;
        color: transparent;
      }

      .check-btn:hover {
        border-color: var(--done-color);
        background: #f0fff4;
        color: var(--done-color);
      }

      .check-btn.done {
        background: var(--done-color);
        border-color: var(--done-color);
        color: white;
      }

      .session.done-session .session-title {
        text-decoration: line-through;
        opacity: 0.5;
      }

      .session.done-session {
        opacity: 0.7;
      }

      /* Legend */
      .legend {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: #666;
        font-weight: 600;
      }

      .legend-dot {
        width: 14px;
        height: 14px;
        border-radius: 4px;
      }

      .legend-dot.review {
        background: #fde8cc;
        border: 1.5px solid #e67e22;
      }
      .legend-dot.study {
        background: #cce5ff;
        border: 1.5px solid #3498db;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎒 جدول <span>المذاكرة</span></h1>
      <p>
        ٥ أسابيع · ٦ أيام في الأسبوع · عربي · إنجليزي · علوم · دراسات · جبر ·
        هندسة
      </p>
    </header>

    <div class="progress-section">
      <h3>📊 التقدم الإجمالي</h3>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="mainProgress"></div>
      </div>
      <div class="progress-label" id="progressLabel">0 من 60 درس</div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot review"></div>
        مراجعة
      </div>
      <div class="legend-item">
        <div class="legend-dot study"></div>
        دراسة
      </div>
    </div>

    <div class="weeks-nav" id="weeksNav"></div>
    <div id="scheduleContainer"></div>

    <script>
      // ============================================================
      //  ✏️ عدّلي هنا أسماء الدروس في أي وقت
      // ============================================================
      const lessons = {
        arabic: {
          review: [
            "مراجعة: الفعل المضارع وعلاماته",
            "مراجعة: المبتدأ والخبر",
            "مراجعة: أنواع الجملة العربية",
            "مراجعة: الإعراب والبناء",
            "مراجعة: الأفعال الخمسة",
          ],
          study: [
            "نص: قصيدة الوطن",
            "نص: المسرحية الشعرية",
            "قواعد: الاسم الموصول",
            "قواعد: الجملة الفعلية",
            "قواعد: المفعول به",
          ],
        },
        english: {
          review: [
            "مراجعة: Present Simple",
            "مراجعة: Past Simple",
            "مراجعة: Vocabulary Unit 1-2",
            "مراجعة: Adjectives & Adverbs",
            "مراجعة: Reading Comprehension",
          ],
          study: [
            "Unit 3: Future Tense",
            "Unit 4: Modal Verbs",
            "Unit 5: Passive Voice",
            "Unit 6: Conditionals",
            "Unit 7: Reported Speech",
          ],
        },
        science: {
          review: [
            "مراجعة: المادة وخواصها",
            "مراجعة: المخلوطات والمحاليل",
            "مراجعة: الحرارة وانتقالها",
            "مراجعة: الخلية الحية",
            "مراجعة: الطاقة وأشكالها",
          ],
          study: [
            "درس: التفاعلات الكيميائية",
            "درس: الضوء والبصريات",
            "درس: الجهاز العصبي",
            "درس: الكهرباء الساكنة",
            "درس: التكاثر عند النباتات",
          ],
        },
        social: {
          review: [
            "مراجعة: الحضارة المصرية القديمة",
            "مراجعة: الموارد الطبيعية",
            "مراجعة: مصر الجغرافية",
            "مراجعة: الثورة العرابية",
            "مراجعة: الديمقراطية والمواطنة",
          ],
          study: [
            "درس: الدولة الإسلامية",
            "درس: المناخ في مصر",
            "درس: الاقتصاد المصري",
            "درس: الوحدة العربية",
            "درس: حقوق الإنسان",
          ],
        },
        algebra: {
          review: [
            "مراجعة: العمليات على الكسور",
            "مراجعة: المعادلات من الدرجة الأولى",
            "مراجعة: الأسس والجذور",
            "مراجعة: النسبة والتناسب",
            "مراجعة: الاحتمالات",
          ],
          study: [
            "درس: المعادلات من الدرجة الثانية",
            "درس: المتتاليات الحسابية",
            "درس: الدوال وتمثيلها",
            "درس: الإحصاء والتمثيل البياني",
            "درس: المتباينات",
          ],
        },
        geometry: {
          review: [
            "مراجعة: الزوايا والمتوازيات",
            "مراجعة: مساحة المثلث",
            "مراجعة: الدائرة وعناصرها",
            "مراجعة: التحويلات الهندسية",
            "مراجعة: المضلعات المنتظمة",
          ],
          study: [
            "درس: متوازي الأضلاع وخواصه",
            "درس: مساحة الأشكال المركبة",
            "درس: نظرية فيثاغورس",
            "درس: الإسقاط والتشابه",
            "درس: الحجوم والأسطح الجانبية",
          ],
        },
      };

      // ============================================================
      //  ترتيب الأيام والمواد
      // ============================================================
      // الأسبوع: سبت، حد، اتنين (الثلاثاء غائب)، تلات، أربع، جمعة(×2)
      // بناءً على اختياركِ: تلات=عربي، أربع=دراسات، خميس=جبر، جمعة=هندسة+إنجليزي، سبت=علوم
      // حد = سيتوزع بشكل دوري لتكملة الجدول

      const DAYS = [
        { name: "الأحد", subject: "arabic" },
        { name: "الثلاثاء", subject: "arabic" },
        { name: "الأربعاء", subject: "social" },
        { name: "الخميس", subject: "algebra" },
        { name: "الجمعة (هندسة)", subject: "geometry" },
        { name: "الجمعة (إنجليزي)", subject: "english" },
        { name: "السبت", subject: "science" },
      ];

      const SUBJECT_META = {
        arabic: { label: "عربي", icon: "📖", cls: "subject-arabic" },
        english: { label: "إنجليزي", icon: "🔤", cls: "subject-english" },
        science: { label: "علوم", icon: "🔬", cls: "subject-science" },
        social: { label: "دراسات", icon: "🌍", cls: "subject-social" },
        algebra: { label: "جبر", icon: "🔢", cls: "subject-algebra" },
        geometry: { label: "هندسة", icon: "📐", cls: "subject-geometry" },
      };

      const NUM_WEEKS = 5;

      // ============================================================
      //  State
      // ============================================================
      let doneMap = {}; // key: "w{week}-d{day}-{type}" => boolean

      function saveState() {
        try {
          localStorage.setItem("studyDone", JSON.stringify(doneMap));
        } catch (e) {}
      }
      function loadState() {
        try {
          const s = localStorage.getItem("studyDone");
          if (s) doneMap = JSON.parse(s);
        } catch (e) {}
      }

      // ============================================================
      //  Build UI
      // ============================================================
      function buildNav() {
        const nav = document.getElementById("weeksNav");
        for (let w = 1; w <= NUM_WEEKS; w++) {
          const btn = document.createElement("button");
          btn.className = "week-btn" + (w === 1 ? " active" : "");
          btn.textContent = `الأسبوع ${w}`;
          btn.dataset.week = w;
          btn.onclick = () => showWeek(w);
          nav.appendChild(btn);
        }
      }

      function showWeek(week) {
        document
          .querySelectorAll(".week-btn")
          .forEach((b) =>
            b.classList.toggle("active", +b.dataset.week === week),
          );
        document
          .querySelectorAll(".week-grid")
          .forEach((g) =>
            g.classList.toggle("visible", +g.dataset.week === week),
          );
      }

      function buildSchedule() {
        const container = document.getElementById("scheduleContainer");

        for (let w = 1; w <= NUM_WEEKS; w++) {
          const grid = document.createElement("div");
          grid.className = "week-grid" + (w === 1 ? " visible" : "");
          grid.dataset.week = w;

          DAYS.forEach((day, di) => {
            grid.appendChild(buildDayCard(w, di, day));
          });

          container.appendChild(grid);
        }
      }

      function buildDayCard(week, dayIdx, day) {
        const meta = SUBJECT_META[day.subject];
        const wIdx = week - 1;

        const card = document.createElement("div");
        card.className = "day-card " + meta.cls;

        // Header
        const header = document.createElement("div");
        header.className = "day-header";
        header.innerHTML = `
    <span class="day-name">${day.name}</span>
    <span class="subject-badge">${meta.icon} ${meta.label}</span>
  `;
        card.appendChild(header);

        // Sessions
        const sessions = document.createElement("div");
        sessions.className = "sessions";

        const revKey = `w${week}-d${dayIdx}-review`;
        sessions.appendChild(
          buildSession(
            revKey,
            "مراجعة",
            "review-session",
            lessons[day.subject].review[wIdx],
          ),
        );

        const stuKey = `w${week}-d${dayIdx}-study`;
        sessions.appendChild(
          buildSession(
            stuKey,
            "دراسة",
            "study-session",
            lessons[day.subject].study[wIdx],
          ),
        );

        card.appendChild(sessions);
        return card;
      }

      function buildSession(key, typeLabel, cls, title) {
        const div = document.createElement("div");
        div.className =
          "session " + cls + (doneMap[key] ? " done-session" : "");
        div.innerHTML = `
    <div class="session-type-label">${typeLabel}</div>
    <div class="session-title">${title}</div>
    <button class="check-btn ${doneMap[key] ? "done" : ""}" data-key="${key}" title="علّم كخلصت">✓</button>
  `;
        div.querySelector(".check-btn").onclick = function () {
          doneMap[key] = !doneMap[key];
          this.classList.toggle("done", doneMap[key]);
          div.classList.toggle("done-session", doneMap[key]);
          saveState();
          updateProgress();
        };
        return div;
      }

      function updateProgress() {
        const total = NUM_WEEKS * DAYS.length * 2; // 7 days × 2 sessions × 5 weeks = 70
        const done = Object.values(doneMap).filter(Boolean).length;
        const pct = Math.round((done / total) * 100);
        document.getElementById("mainProgress").style.width = pct + "%";
        document.getElementById("progressLabel").textContent =
          `${done} من ${total} درس (${pct}%)`;
      }

      // Init
      loadState();
      buildNav();
      buildSchedule();
      updateProgress();
    </script>
  </body>
</html>
