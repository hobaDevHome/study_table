<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول المذاكرة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎒 جدول <span>المذاكرة</span></h1>
    <p>٥ أسابيع · ٦ أيام في الأسبوع · عربي · إنجليزي · علوم · دراسات · جبر · هندسة</p>
  </header>

  <div class="progress-section">
    <h3>📊 التقدم الإجمالي</h3>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="mainProgress"></div>
    </div>
    <div class="progress-label" id="progressLabel">0 من 70 درس</div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot review"></div> مراجعة</div>
    <div class="legend-item"><div class="legend-dot study"></div> دراسة</div>
  </div>

  <div class="weeks-nav" id="weeksNav"></div>
  <div id="scheduleContainer"></div>

  <script src="app.js"></script>
</body>
</html>
